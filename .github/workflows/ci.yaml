name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - name: Install Dependencies
        run: npm ci --no-fund
      - name: Check repository files
        run: npm run check:repo && npm run test:repo
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run test:types
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          OUTNUMBER_SEASON: sample
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist/client &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4174/game.html > /dev/null
          npm run test:ui
